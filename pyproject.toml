[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-backup-system"
version = "1.0.2"
description = "Automated secure Frappe / ERPNext local backup system for Windows desktop"
authors = [{ name = "Local Backup System Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "paramiko>=3.4.0",
    "cryptography>=42.0.0",
    "keyring>=24.3.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pyinstaller>=6.5.0",
]

[project.scripts]
local-backup-system = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
